<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Gym Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg max-w-sm w-full">
        <h2 class="text-white text-3xl font-semibold text-center mb-6">Login</h2>
        
        <!-- Error/Success Messages -->
        <div id="message" class="mb-4 hidden"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label for="email" class="block text-white text-sm font-medium mb-2">Email</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 bg-gray-700 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="block text-white text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 bg-gray-700 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400">Login</button>
        </form>

        <p class="text-center text-white text-sm mt-4">
            Don't have an account? <a href="/auth/signup" class="text-blue-400 hover:underline">Sign up</a>
        </p>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitButton = event.target.querySelector('button[type="submit"]');
            
            // Get form values
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Disable submit button
            submitButton.disabled = true;
            submitButton.textContent = 'Logging in...';
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store access token
                    if (data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                    }
                    
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Redirect to workout page after 1 second
                    setTimeout(() => {
                        window.location.href = '/workout/';
                    }, 1000);
                } else {
                    showMessage(data.error || 'Login failed. Please check your credentials.', 'error');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Login';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Network error. Please try again.', 'error');
                submitButton.disabled = false;
                submitButton.textContent = 'Login';
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `mb-4 p-3 rounded-md ${type === 'error' ? 'bg-red-500' : 'bg-green-500'} text-white`;
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden');
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 5000);
            }
        }
    </script>
</body>
</html>
